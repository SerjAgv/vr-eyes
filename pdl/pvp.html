<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Padel Vision Pro Fixed</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft" raycaster="objects: .clickable, .ball">
      
      <a-sky color="#050505"></a-sky>

      <a-plane position="0 0 -5" rotation="-90 0 0" width="10" height="20" color="#1a472a"></a-plane>
      
      <a-box id="target-left" class="clickable" 
             position="-4.9 1.5 -4" width="0.1" height="2" depth="1.5" 
             color="#ff0000" material="opacity: 0; transparent: true; emissive: #ff0000; emissiveIntensity: 0">
      </a-box>

      <a-box id="target-right" class="clickable" 
             position="4.9 1.5 -4" width="0.1" height="2" depth="1.5" 
             color="#ff0000" material="opacity: 0; transparent: true; emissive: #ff0000; emissiveIntensity: 0">
      </a-box>

      <a-entity id="rig">
        <a-camera look-controls wasd-controls-enabled="false">
          <a-cursor fuse="false" raycaster="objects: .ball" color="yellow"></a-cursor>
          
          <a-entity position="0 1.2 -2">
            <a-text id="level-txt" value="STARTING..." align="center" color="#00fff2" width="4"></a-text>
            <a-text id="stats-txt" value="Score: 0" align="center" color="white" width="3" position="0 -0.2 0"></a-text>
          </a-entity>
        </a-camera>

        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10; interval: 50"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10; interval: 50"></a-entity>
      </a-entity>

      <script>
        let score = 0;
        let level = 1;
        let peripheralTime = 1200;

        const leftT = document.querySelector('#target-left');
        const rightT = document.querySelector('#target-right');

        // Функция вспышки
        function flash() {
          const target = Math.random() > 0.5 ? leftT : rightT;
          
          // Делаем мишень видимой через прозрачность и свечение
          target.setAttribute('material', 'opacity', '0.7');
          target.setAttribute('material', 'emissiveIntensity', '2');
          
          // Логика автоматического скрытия, если не успел нажать
          setTimeout(() => {
            target.setAttribute('material', 'opacity', '0');
            target.setAttribute('material', 'emissiveIntensity', '0');
          }, peripheralTime);
        }

        // Обработка клика
        function setupInteraction() {
          const targets = document.querySelectorAll('.clickable');
          targets.forEach(t => {
            t.addEventListener('mousedown', function() {
              // Проверяем, активна ли мишень в данный момент (opacity > 0)
              if (this.getAttribute('material').opacity > 0) {
                score++;
                document.querySelector('#stats-txt').setAttribute('value', `Score: ${score}`);
                
                // Эффект успеха
                this.setAttribute('material', 'color', '#00ff00');
                this.setAttribute('material', 'opacity', '0'); // Сразу гасим
                
                setTimeout(() => {
                  this.setAttribute('material', 'color', '#ff0000');
                }, 200);

                // Усложнение
                if (score % 5 === 0) {
                    level++;
                    peripheralTime = Math.max(400, peripheralTime - 100);
                    document.querySelector('#level-txt').setAttribute('value', `LEVEL: ${level}`);
                }
              }
            });
          });
        }

        // Запуск
        setInterval(flash, 3000);
        setupInteraction();

        // Логика мяча (упрощенная для проверки)
        function spawnBall() {
          const ball = document.createElement('a-sphere');
          ball.setAttribute('class', 'ball');
          ball.setAttribute('radius', '0.1');
          ball.setAttribute('color', '#ccff00');
          ball.setAttribute('position', '0 1.5 -10');
          ball.setAttribute('animation', {
            property: 'position',
            to: `${(Math.random()-0.5)*4} 1.5 2`,
            dur: 2000,
            easing: 'linear'
          });
          document.querySelector('a-scene').appendChild(ball);
          setTimeout(() => ball.remove(), 2000);
        }
        setInterval(spawnBall, 2000);
      </script>
    </a-scene>
  </body>
</html>
