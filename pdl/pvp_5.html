<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Padel VR Pro: Double Ball Mode</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .clickable, .ball">
      
      <a-assets>
        <img id="grid" src="https://img.freepik.com/free-vector/black-metal-wire-mesh-pattern-background_1017-26330.jpg">
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>
      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="directional" position="2 5 -3" intensity="0.7" castShadow="true"></a-light>

      <a-plane position="0 0 -5" rotation="-90 0 0" width="10" height="20" color="#2e7d32" shadow></a-plane>
      <a-plane position="0 0.02 -5" rotation="-90 0 0" width="0.1" height="20" color="white"></a-plane> 
      
      <a-box position="0 1.5 -10" width="10" height="3" depth="0.1" material="color: #88ccff; opacity: 0.2; transparent: true"></a-box>
      <a-box position="-5 1.5 -7.5" width="0.1" height="3" depth="5" material="color: #88ccff; opacity: 0.2; transparent: true"></a-box>
      <a-box position="5 1.5 -7.5" width="0.1" height="3" depth="5" material="color: #88ccff; opacity: 0.2; transparent: true"></a-box>

      <a-box id="target-left" class="clickable" position="-4.98 1.5 -4" width="0.05" height="2.5" depth="2" material="opacity: 0; transparent: true"></a-box>
      <a-box id="target-right" class="clickable" position="4.98 1.5 -4" width="0.05" height="2.5" depth="2" material="opacity: 0; transparent: true"></a-box>

      <a-entity id="rig">
        <a-camera look-controls wasd-controls-enabled="false">
          <a-entity position="0 1.2 -2.5">
            <a-entity id="hud">
                <a-text id="level-txt" value="LEVEL 1" align="center" color="#00fff2" width="4" position="0 0.3 0"></a-text>
                <a-text id="ball-stats" value="Balls: 0 hit" align="center" color="#ccff00" width="2.5" position="0 0.15 0"></a-text>
                <a-text id="vision-stats" value="Vision: 0 hit" align="center" color="#ff4444" width="2.5" position="0 0.05 0"></a-text>
                <a-text id="timer-txt" value="15:00" align="center" color="white" width="2" position="0 -0.3 0"></a-text>
            </a-entity>

            <a-entity id="results-panel" position="0 0 0.1" visible="false">
                <a-plane width="3" height="2" color="#111" opacity="0.95"></a-plane>
                <a-text value="TRAINING COMPLETE" align="center" color="#ffeb3b" width="5" position="0 0.7 0.01"></a-text>
                <a-text id="final-stats" value="" align="center" color="white" width="3.5" position="0 0 0.01"></a-text>
                <a-plane id="restart-btn" class="clickable" width="1" height="0.3" color="#2e7d32" position="0 -0.7 0.01">
                    <a-text value="RESTART" align="center" color="white" width="3" position="0 0 0.01"></a-text>
                </a-plane>
            </a-entity>
          </a-entity>
        </a-camera>
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable, .ball; far: 10; interval: 30"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable, .ball; far: 10; interval: 30"></a-entity>
      </a-entity>

      <script>
        let stats = { ballHit: 0, ballMiss: 0, visionHit: 0, visionMiss: 0 };
        let level = 1, ballSpeed = 1500, peripheralTime = 900, timeLeft = 15 * 60;
        let isGameOver = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, duration = 0.1, type = 'sine') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
          osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function updateUI() {
          document.querySelector('#ball-stats').setAttribute('value', `Balls: ${stats.ballHit} hit / ${stats.ballMiss} miss`);
          document.querySelector('#vision-stats').setAttribute('value', `Vision: ${stats.visionHit} hit / ${stats.visionMiss} miss`);
          let total = stats.ballHit + stats.visionHit;
          if (total > 0 && total % 10 === 0) {
            level = Math.floor(total / 10) + 1;
            document.querySelector('#level-txt').setAttribute('value', `LEVEL ${level}`);
            ballSpeed = Math.max(300, 1500 - (level * 120));
          }
        }

        // Функция создания одного мяча
        function createSingleBall() {
          const ball = document.createElement('a-sphere');
          ball.setAttribute('class', 'ball clickable');
          ball.setAttribute('radius', '0.12');
          ball.setAttribute('color', '#ccff00');
          
          const side = Math.random() > 0.5 ? 1 : -1;
          const start = { x: (Math.random()-0.5)*2, y: 1.5, z: -2 };
          const p1 = { x: 4.8 * side * Math.random(), y: 0.5, z: -7 - Math.random()*2 };
          const p2 = { x: 4 * side, y: 1.2, z: -9.8 };
          const p3 = { x: (Math.random()-0.5)*6, y: 1.2, z: 2.5 };

          ball.setAttribute('position', `${start.x} ${start.y} ${start.z}`);
          ball.setAttribute('animation__1', { property: 'position', to: `${p1.x} ${p1.y} ${p1.z}`, dur: ballSpeed * 0.3, easing: 'linear' });
          ball.setAttribute('animation__2', { property: 'position', from: `${p1.x} ${p1.y} ${p1.z}`, to: `${p2.x} ${p2.y} ${p2.z}`, dur: ballSpeed * 0.2, delay: ballSpeed * 0.3, easing: 'linear' });
          ball.setAttribute('animation__3', { property: 'position', from: `${p2.x} ${p2.y} ${p2.z}`, to: `${p3.x} ${p3.y} ${p3.z}`, dur: ballSpeed * 0.5, delay: ballSpeed * 0.5, easing: 'linear' });

          let hit = false;
          ball.addEventListener('mousedown', () => {
            if(!hit && !isGameOver) { hit = true; stats.ballHit++; playSound(880); updateUI(); ball.remove(); }
          });
          document.querySelector('a-scene').appendChild(ball);
          setTimeout(() => { if (ball.parentNode) { if (!hit && !isGameOver) { stats.ballMiss++; updateUI(); } ball.remove(); } }, ballSpeed + 500);
        }

        // Спавн двух мячей сразу
        function spawnBalls() {
          if (isGameOver) return;
          createSingleBall();
          setTimeout(createSingleBall, 300); // Второй мяч с небольшой задержкой для динамики
        }

        function triggerFlash() {
          if (isGameOver) return;
          const target = Math.random() > 0.5 ? document.querySelector('#target-left') : document.querySelector('#target-right');
          const color = ['#ff0000', '#00ff00', '#0000ff', '#ffff00'][Math.floor(Math.random()*4)];
          target.setAttribute('material', {color: color, emissive: color, opacity: 0.8, emissiveIntensity: 2});
          let clicked = false;
          const handler = () => { if(!clicked && !isGameOver) { clicked = true; stats.visionHit++; playSound(440); target.setAttribute('material', {opacity: 0}); updateUI(); }};
          target.addEventListener('mousedown', handler);
          setTimeout(() => { if (!clicked && !isGameOver) { stats.visionMiss++; updateUI(); } target.setAttribute('material', {opacity: 0}); }, peripheralTime);
        }

        function endGame() {
          isGameOver = true;
          playSound(150, 1.5, 'sawtooth'); // Финальная сирена
          document.querySelector('#hud').setAttribute('visible', 'false');
          document.querySelector('#results-panel').setAttribute('visible', 'true');
          
          const ballAcc = Math.round((stats.ballHit / (stats.ballHit + stats.ballMiss || 1)) * 100);
          document.querySelector('#final-stats').setAttribute('value', 
            `Total Hits: ${stats.ballHit + stats.visionHit}\n` +
            `Accuracy: ${ballAcc}%\n` +
            `Level: ${level}`);
        }

        document.querySelector('#restart-btn').addEventListener('click', () => location.reload());

        setInterval(spawnBalls, 2000);
        setInterval(triggerFlash, 3000);
        setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.querySelector('#timer-txt').setAttribute('value', `${m}:${s < 10 ? '0' : ''}${s}`);
          } else if (!isGameOver) {
            endGame();
          }
        }, 1000);
      </script>
    </a-scene>
  </body>
</html>
