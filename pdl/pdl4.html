<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Падель-хаос</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: background-image 2s ease-in-out;
    }

    .ball {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, yellow, orange);
      box-shadow: 0 0 10px rgba(255, 255, 0, 0.7);
      pointer-events: none;
      transition: transform 0.05s linear;
    }

    #controls {
      position: absolute;
      top: 5px;
      left: 5px;
      color: white;
      font-family: sans-serif;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      padding: 5px;
      border-radius: 12px;
    }

    #controls input, #controls button, #controls select {
      margin-top: 5px;
      width: 100%;
    }
    
    #controls.collapsed {
      height: auto;
      width: auto;
      padding: 5px;
    }
    
    #controls.collapsed button:not(#toggleControls),
    #controls.collapsed input,
    #controls.collapsed label,
    #controls.collapsed select {
      display: none;
    }

  </style>
  
</head>
<body>
  <div id="controls">
    <button id="toggleControls"> . </button>
    
    <label for="speedSlider">Скорость: <span id="speedValue">50</span></label>
    <input type="range" id="speedSlider" min="0" max="100" value="50">
    
    <br/><br/>
    
    <label for="directionSelect">Направление</label>
    <select id="directionSelect">
      <option value="chaotic" selected>Хаотично</option>
      <option value="diagonal">По диагоналям</option>
      <option value="cross">Крест на крест</option>
    </select>

    <br/><br/>

    <button onclick="createBall()">Добавить мяч</button>
  </div>

  <script>
    const balls = [];
    const ballSize = 30;
    const backgrounds = [
      'pdl_court/green1.jpg',
      'pdl_court/green2.jpg',
      'pdl_court/green3.jpg',
      'pdl_court/green4.jpg',
      'pdl_court/green5.jpg',
      'pdl_court/green6.jpg',
      'pdl_court/green7.jpg',
      'pdl_court/green8.jpg',
      'pdl_court/green9.jpg',
      'pdl_court/green10.jpg',
      'pdl_court/green11.jpg',
      'pdl_court/green12.jpg',
      'pdl_court/green13.jpg',
      'pdl_court/green14.jpg',
      'pdl_court/green15.png',
      'pdl_court/green16.jpg',
      'pdl_court/green17.jpg',
      'pdl_court/green18.jpg',
      'pdl_court/green19.jpg',
      'pdl_court/green20.jpg',
      'pdl_court/green21.jpg',
      'pdl_court/green22.jpg',
      'pdl_court/green23.jpg',
      'pdl_court/green24.jpg',
      'pdl_court/green25.jpg',
      'pdl_court/blue1.webp',
      'pdl_court/blue2.webp',
      'pdl_court/blue3.jpeg',
      'pdl_court/blue3.webp',
      'pdl_court/blue4.webp',
      'pdl_court/blue5.webp',
      'pdl_court/blue6.webp',
      'pdl_court/blue7.webp',
      'pdl_court/blue8.jpeg',
      'pdl_court/people1.webp',
      'pdl_court/people2.webp'
      
      
      
    ];

    let directionMode = 'chaotic';
    document.getElementById('directionSelect').addEventListener('change', (e) => {
      directionMode = e.target.value;
    });

    const speedSlider = document.getElementById('speedSlider');
    const speedValueLabel = document.getElementById('speedValue');

    speedSlider.addEventListener('input', () => {
      speedValueLabel.textContent = speedSlider.value;
    });
    
    const controls = document.getElementById('controls');
    const toggleBtn = document.getElementById('toggleControls');
    
    toggleBtn.addEventListener('click', () => {
      controls.classList.toggle('collapsed');
      toggleBtn.textContent = controls.classList.contains('collapsed') ? '+' : '-';
    });


    function getRandomVelocity() {
      const sliderValue = Number(speedSlider.value); // 0–100
      const baseSpeed = sliderValue * 30; // масштабируем скорость
      const sign = Math.random() > 0.5 ? 1 : -1;
      return (baseSpeed + Math.random() * baseSpeed * 0.5) * sign;
    }


    function createBall() {
      const ball = document.createElement('div');
      ball.classList.add('ball');
      document.body.appendChild(ball);

      let posX = Math.random() * (window.innerWidth - ballSize);
      let posY = Math.random() * (window.innerHeight - ballSize);
      let velocityX, velocityY;

      if (directionMode === 'diagonal') {
        const sliderValue = Number(speedSlider.value);
        const speed = sliderValue * 20 + 100;
        
        // Выбираем одну из 4 диагоналей
        const dirs = [
          { vx: 1, vy: 1 },   // ↘️
          { vx: -1, vy: 1 },  // ↙️
          { vx: -1, vy: -1 }, // ↖️
          { vx: 1, vy: -1 },  // ↗️
        ];
        const d = dirs[Math.floor(Math.random() * dirs.length)];
        velocityX = speed * d.vx;
        velocityY = speed * d.vy;
      } else if (directionMode === 'cross') {
        const speed = Number(speedSlider.value) * 2 + Math.random() * 20;
        if (Math.random() > 0.5) {
          velocityX = speed * (Math.random() > 0.5 ? 1 : -1);
          velocityY = 0;
        } else {
          velocityX = 0;
          velocityY = speed * (Math.random() > 0.5 ? 1 : -1);
        }
      } else {
        velocityX = getRandomVelocity();
        velocityY = getRandomVelocity();
      }

      balls.push({ el: ball, posX, posY, velocityX, velocityY, scale: 1, scaleDir: 1 });
    }

    function updateBalls() {
      const maxX = window.innerWidth - ballSize;
      const maxY = window.innerHeight - ballSize;

      balls.forEach(ball => {
        ball.posX += ball.velocityX * 0.016;
        ball.posY += ball.velocityY * 0.016;

        const hitX = ball.posX <= 0 || ball.posX >= maxX;
        const hitY = ball.posY <= 0 || ball.posY >= maxY;

        if (directionMode === 'diagonal') {
          if (hitX) ball.velocityX *= -1;
          if (hitY) ball.velocityY *= -1;
        } else {
          if (hitX) {
            ball.velocityX = getRandomVelocity();
            ball.posX = Math.max(0, Math.min(ball.posX, maxX));
          }
          if (hitY) {
            ball.velocityY = getRandomVelocity();
            ball.posY = Math.max(0, Math.min(ball.posY, maxY));
          }
        }

        ball.scale += 0.02 * ball.scaleDir;
        if (ball.scale > 1.5 || ball.scale < 0.5) ball.scaleDir *= -1;

        ball.el.style.transform = `translate(${ball.posX}px, ${ball.posY}px) scale(${ball.scale})`;
      });

      requestAnimationFrame(updateBalls);
    }

    function cycleBackgrounds() {
      let current = 0;
      setInterval(() => {
        current = (current + 1) % backgrounds.length;
        document.body.style.backgroundImage = `url('${backgrounds[current]}')`;
      }, 5000);
    }

    // ✅ В начале только 1 мяч
    createBall();

    updateBalls();
    cycleBackgrounds();
  </script>
</body>
</html>
