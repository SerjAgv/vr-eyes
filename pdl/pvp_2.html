<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Padel VR: Ultimate Settings</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcfsoft" cursor="rayOrigin: mouse" raycaster="objects: .clickable, .ball">
      
      <a-assets>
        <img id="grid" src="https://img.freepik.com/free-vector/black-metal-wire-mesh-pattern-background_1017-26330.jpg">
      </a-assets>

      <a-sky id="main-sky" color="#87CEEB"></a-sky>
      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light id="sun-light" type="directional" position="2 5 -3" intensity="0.7"></a-light>

      <a-plane id="court-floor" position="0 0 -5" rotation="-90 0 0" width="10" height="20" color="#2c5d3f"></a-plane>
      <a-plane position="0 0.02 -5" rotation="-90 0 0" width="0.1" height="20" color="white"></a-plane> 

      <a-box id="wall-back" position="0 1.5 -10" width="10" height="3" depth="0.1" material="color: #88ccff; opacity: 0.2; transparent: true"></a-box>
      <a-box id="wall-left" position="-5 1.5 -7.5" width="0.1" height="3" depth="5" material="color: #88ccff; opacity: 0.2; transparent: true"></a-box>
      <a-box id="wall-right" position="5 1.5 -7.5" width="0.1" height="3" depth="5" material="color: #88ccff; opacity: 0.2; transparent: true"></a-box>

      <a-box id="target-left" class="clickable" position="-4.95 1.5 -4" width="0.05" height="2.5" depth="2" material="opacity: 0; transparent: true; emissive: #ff0000; emissiveIntensity: 0; color: #ff0000"></a-box>
      <a-box id="target-right" class="clickable" position="4.95 1.5 -4" width="0.05" height="2.5" depth="2" material="opacity: 0; transparent: true; emissive: #ff0000; emissiveIntensity: 0; color: #ff0000"></a-box>

      <a-entity id="rig">
        <a-camera look-controls wasd-controls-enabled="false">
          <a-cursor fuse="true" fuse-timeout="150" raycaster="objects: .ball, .clickable" color="#ccff00"></a-cursor>
          
          <a-entity position="0 1.3 -2.5">
            <a-text id="status-txt" value="SETTINGS MODE" align="center" color="#00fff2" width="4" position="0 0.5 0"></a-text>
            <a-text id="ball-stats" value="Balls: 0/0" align="center" color="#ccff00" width="2.5" position="-0.7 0.3 0"></a-text>
            <a-text id="vision-stats" value="Vision: 0/0" align="center" color="#ff4444" width="2.5" position="0.7 0.3 0"></a-text>

            <a-entity position="0 0 0">
                <a-text value="DIFFICULTY" align="center" width="2.5" position="0 0.1 0"></a-text>
                <a-box class="clickable" position="-0.6 -0.1 0" width="0.4" height="0.15" depth="0.05" color="#444" onclick="setDiff('easy')"><a-text value="EASY" align="center" scale="0.4 0.4 0.4"></a-text></a-box>
                <a-box class="clickable" position="0 -0.1 0" width="0.4" height="0.15" depth="0.05" color="#444" onclick="setDiff('med')"><a-text value="MED" align="center" scale="0.4 0.4 0.4"></a-text></a-box>
                <a-box class="clickable" position="0.6 -0.1 0" width="0.4" height="0.15" depth="0.05" color="#444" onclick="setDiff('hard')"><a-text value="HARD" align="center" scale="0.4 0.4 0.4"></a-text></a-box>
            </a-entity>

            <a-entity position="0 -0.4 0">
                <a-text value="COURT COLOR" align="center" width="2.5" position="0 0.1 0"></a-text>
                <a-box class="clickable" position="-0.6 -0.1 0" width="0.4" height="0.15" depth="0.05" color="#2c5d3f" onclick="setCourt('#2c5d3f')"></a-box>
                <a-box class="clickable" position="0 -0.1 0" width="0.4" height="0.15" depth="0.05" color="#1e3a8a" onclick="setCourt('#1e3a8a')"></a-box>
                <a-box class="clickable" position="0.6 -0.1 0" width="0.4" height="0.15" depth="0.05" color="#8b0000" onclick="setCourt('#8b0000')"></a-box>
            </a-entity>

            <a-entity position="0 -0.8 0">
                <a-text value="WALL TINT" align="center" width="2.5" position="0 0.1 0"></a-text>
                <a-box class="clickable" position="-0.4 -0.1 0" width="0.6" height="0.15" depth="0.05" color="#88ccff" onclick="setWall('#88ccff', 0.2)"></a-box>
                <a-box class="clickable" position="0.4 -0.1 0" width="0.6" height="0.15" depth="0.05" color="#111" onclick="setWall('#111', 0.5)"></a-box>
            </a-entity>
          </a-entity>
        </a-camera>
      </a-entity>

      <script>
        let stats = { ballHit: 0, ballMiss: 0, visionHit: 0, visionMiss: 0 };
        let ballBaseDur = 2500, periphBaseDur = 1500;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function setDiff(d) {
            if(d === 'easy') { ballBaseDur = 3200; periphBaseDur = 2000; }
            if(d === 'med') { ballBaseDur = 2200; periphBaseDur = 1300; }
            if(d === 'hard') { ballBaseDur = 1200; periphBaseDur = 700; }
            document.querySelector('#status-txt').setAttribute('value', "DIFFICULTY: " + d.toUpperCase());
        }

        function setCourt(color) { document.querySelector('#court-floor').setAttribute('color', color); }
        function setWall(color, op) { 
            const walls = ['#wall-back', '#wall-left', '#wall-right'];
            walls.forEach(w => {
                document.querySelector(w).setAttribute('material', {color: color, opacity: op});
            });
        }

        function playSound(freq) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function spawnBall() {
          const ball = document.createElement('a-sphere');
          ball.setAttribute('class', 'ball');
          ball.setAttribute('radius', '0.12');
          ball.setAttribute('color', '#ccff00');
          
          const start = { x: (Math.random()-0.5)*2, y: 1.5, z: -1 };
          const pFloor = { x: (Math.random()-0.5)*6, y: 0.12, z: -4 - Math.random()*4 };
          const pWall = { x: (Math.random()-0.5)*8, y: 0.3 + Math.random()*2, z: -9.9 };
          const pPlayer = { x: (Math.random()-0.5)*6, y: 0.5 + Math.random()*2.5, z: 3 };

          ball.setAttribute('position', `${start.x} ${start.y} ${start.z}`);
          ball.setAttribute('animation__1', { property: 'position', to: `${pFloor.x} ${pFloor.y} ${pFloor.z}`, dur: ballBaseDur * 0.35, easing: 'easeInQuad' });
          ball.setAttribute('animation__2', { property: 'position', from: `${pFloor.x} ${pFloor.y} ${pFloor.z}`, to: `${pWall.x} ${pWall.y} ${pWall.z}`, dur: ballBaseDur * 0.2, delay: ballBaseDur * 0.35, easing: 'easeOutQuad' });
          ball.setAttribute('animation__3', { property: 'position', from: `${pWall.x} ${pWall.y} ${pWall.z}`, to: `${pPlayer.x} ${pPlayer.y} ${pPlayer.z}`, dur: ballBaseDur * 0.45, delay: ballBaseDur * 0.55, easing: 'linear' });

          let hit = false;
          ball.addEventListener('click', () => { 
            if(!hit) { hit = true; stats.ballHit++; playSound(880); updateUI(); ball.remove(); } 
          });
          document.querySelector('a-scene').appendChild(ball);
          setTimeout(() => { if (ball.parentNode) { if (!hit) { stats.ballMiss++; updateUI(); } ball.remove(); } }, ballBaseDur + 1000);
        }

        function updateUI() {
          document.querySelector('#ball-stats').setAttribute('value', `Balls: ${stats.ballHit}/${stats.ballMiss}`);
          document.querySelector('#vision-stats').setAttribute('value', `Vision: ${stats.visionHit}/${stats.visionMiss}`);
        }

        function triggerFlash() {
          const target = Math.random() > 0.5 ? document.querySelector('#target-left') : document.querySelector('#target-right');
          if (target.getAttribute('material').opacity > 0) return;
          target.setAttribute('material', {opacity: 0.7, emissiveIntensity: 1.5});
          let clicked = false;
          const h = () => { if(!clicked) { clicked = true; stats.visionHit++; playSound(440); target.setAttribute('material', {opacity: 0, emissiveIntensity: 0}); updateUI(); target.removeEventListener('click', h); }};
          target.addEventListener('click', h);
          setTimeout(() => { if (!clicked) { stats.visionMiss++; updateUI(); } target.setAttribute('material', {opacity: 0, emissiveIntensity: 0}); target.removeEventListener('click', h); }, periphBaseDur);
        }

        setInterval(spawnBall, 2600);
        setInterval(triggerFlash, 4500);
      </script>
    </a-scene>
  </body>
</html>
