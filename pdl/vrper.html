<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Peripheral Pro - Glass UI Edition</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #121212">
      
      <a-assets>
        <audio id="success-sound" src="success.mp3" preload="auto"></audio>
        <audio id="error-sound" src="error.mp3" preload="auto"></audio>
      </a-assets>

      <a-entity environment="preset: night; shadow: false; playArea: 1; dressingAmount: 0"></a-entity>

      <a-entity id="rig" position="0 0.3 0">
        <a-camera look-controls wasd-controls="enabled: false" position="0 1.6 0">
          <a-sphere id="fixation-dot" position="0 0 -1.1" radius="0.005" color="#ff0000" shader="flat" visible="false"></a-sphere>
          <a-entity cursor="rayOrigin: mouse"></a-entity>
        </a-camera>
        
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable; far: 10"></a-entity>
      </a-entity>

      <a-entity id="start-screen" position="0 1.9 -2">
        <a-plane id="start-button" class="clickable" width="1" height="0.5" color="#4CAF50" material="shader: flat">
          <a-text value="START" color="white" align="center" width="6" position="0 0 0.01"></a-text>
        </a-plane>
        <a-text value="Look at the red dot\nFind the solid circle" position="0 -0.5 0" align="center" width="3"></a-text>
      </a-entity>

      <a-entity id="game-container" position="0 1.9 -3" visible="false"></a-entity>

      <a-entity id="ui-panel" position="0 3.6 -2.8" rotation="15 0 0" visible="false">
        <a-plane width="1.2" height="0.25" color="#000" material="shader: flat; opacity: 0.4; transparent: true">
          <a-text id="stat-text" value="Grid: 3x3 | Score: 0" color="white" align="center" position="0 0.05 0.01" width="2"></a-text>
          <a-text id="speed-text" value="Flash: 600ms" color="#FF5252" align="center" position="0 -0.07 0.01" width="1.6"></a-text>
        </a-plane>
      </a-entity>

      <a-entity id="success-sound-entity" sound="src: #success-sound"></a-entity>
      <a-entity id="error-sound-entity" sound="src: #error-sound"></a-entity>

    </a-scene>

    <script>
      const container = document.getElementById('game-container');
      const startScreen = document.getElementById('start-screen');
      const uiPanel = document.getElementById('ui-panel');
      const fixationDot = document.getElementById('fixation-dot');
      const statText = document.getElementById('stat-text');
      const speedText = document.getElementById('speed-text');

      let score = 0;
      let totalCorrect = 0;
      let gridSize = 3; 
      let currentFlash = 600;
      const minFlash = 50;
      
      let gameActive = false;
      let targetIndex = null;
      let symbols = [];

      document.getElementById('start-button').addEventListener('mousedown', function() {
        startScreen.setAttribute('visible', 'false');
        startScreen.setAttribute('position', '0 -10 0');
        
        container.setAttribute('visible', 'true');
        uiPanel.setAttribute('visible', 'true');
        fixationDot.setAttribute('visible', 'true');

        const successEnt = document.getElementById('success-sound-entity');
        if(successEnt.components.sound) successEnt.components.sound.playSound();
        if(successEnt.components.sound) successEnt.components.sound.stopSound();

        setupGrid();
      });

      function setupGrid() {
        container.innerHTML = '';
        symbols = [];
        
        gridSize = 3 + Math.floor(totalCorrect / 5);
        gridSize = Math.min(gridSize, 7);

        const numTiles = gridSize * gridSize;
        targetIndex = Math.floor(Math.random() * numTiles);

        const spacing = 3.5 / gridSize; 
        const tileSize = spacing * 0.85;

        for (let i = 0; i < numTiles; i++) {
          const row = Math.floor(i / gridSize);
          const col = i % gridSize;

          const posX = (col - (gridSize - 1) / 2) * spacing;
          const posY = ((gridSize - 1) / 2 - row) * spacing;

          const { tile, symbol } = createTile(posX, posY, tileSize, i);
          
          if (i !== targetIndex) {
            const torus = symbol.querySelector('a-torus');
            torus.setAttribute('arc', '290');
            const rots = [0, 90, 180, 270];
            torus.setAttribute('rotation', `0 0 ${rots[Math.floor(Math.random() * rots.length)]}`);
          }
          
          container.appendChild(tile);
          symbols.push(symbol);
        }

        updateUI();
        setTimeout(flash, 1200);
      }

      function createTile(x, y, size, index) {
        const tile = document.createElement('a-plane');
        tile.setAttribute('position', `${x} ${y} 0`);
        tile.setAttribute('width', size);
        tile.setAttribute('height', size);
        tile.setAttribute('class', 'tile clickable');
        tile.setAttribute('color', '#ffffff');
        tile.setAttribute('material', 'shader: flat');

        const symbol = document.createElement('a-entity');
        symbol.setAttribute('visible', 'false');

        const ring = document.createElement('a-torus');
        ring.setAttribute('radius', size * 0.25);
        ring.setAttribute('radius-tubular', size * 0.04);
        ring.setAttribute('color', '#2c2c2c');

        symbol.appendChild(ring);
        tile.appendChild(symbol);

        tile.addEventListener('mousedown', () => {
          if (!gameActive) return;
          tile.setAttribute('color', '#FFEB3B');
          setTimeout(() => tile.setAttribute('color', '#ffffff'), 150);
          handleChoice(index);
        });

        return { tile, symbol };
      }

      function flash() {
        gameActive = false;
        symbols.forEach(s => s.setAttribute('visible', 'true'));
        setTimeout(() => {
          symbols.forEach(s => s.setAttribute('visible', 'false'));
          gameActive = true;
        }, currentFlash);
      }

      function handleChoice(index) {
        gameActive = false;
        const successEnt = document.getElementById('success-sound-entity');
        const errorEnt = document.getElementById('error-sound-entity');

        if (index === targetIndex) {
          totalCorrect++;
          score++;
          currentFlash = Math.max(minFlash, currentFlash - 40);
          if(successEnt.components.sound) successEnt.components.sound.playSound();
        } else {
          totalCorrect = 0;
          score = 0;
          currentFlash = 600;
          gridSize = 3;
          if(errorEnt.components.sound) errorEnt.components.sound.playSound();
        }

        updateUI();
        setTimeout(setupGrid, 800);
      }

      function updateUI() {
        statText.setAttribute('value', `Grid: ${gridSize}x${gridSize} | Score: ${score}`);
        speedText.setAttribute('value', `Flash: ${Math.round(currentFlash)}ms`);
      }
    </script>
  </body>
</html>
