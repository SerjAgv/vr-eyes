<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Reaction Training VR — Padel</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    #startButton {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 1.5em 3em; font-size: 2em; border: none;
      border-radius: 12px; cursor: pointer;
      background: white; color: black; z-index: 10;
    }
    #info {
      position: absolute; top: 10px; left: 10px;
      color: white; font-size: 16px; z-index: 10;
      text-shadow: 0 0 5px black;
    }
    #hud {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: white; font-size: 22px; z-index: 10;
      text-shadow: 0 0 5px black; text-align: center;
    }
  </style>
</head>
<body>

  <div id="info">Eye Reaction Training — VR Padel</div>
  <div id="hud">Наведи контроллер на мяч и нажми триггер</div>
  <button id="startButton">Старт VR</button>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    // ---------- ФОНОВЫЕ ПАНОРАМЫ (из оригинала) ----------
    const backgrounds = [
      'pdl_court/green1.jpg',
      'pdl_court/green2.jpg',
      'pdl_court/green3.jpg',
      'pdl_court/green4.jpg',
      'pdl_court/green5.jpg',
      'pdl_court/green6.jpg',
      'pdl_court/green7.jpg',
      'pdl_court/green8.jpg',
      'pdl_court/green9.jpg',
      'pdl_court/green10.jpg',
      'pdl_court/green11.jpg',
      'pdl_court/green12.jpg',
      'pdl_court/green13.jpg',
      'pdl_court/green14.jpg',
      'pdl_court/green15.png',
      'pdl_court/green16.jpg',
      'pdl_court/green17.jpg',
      'pdl_court/green18.jpg',
      'pdl_court/green19.jpg',
      'pdl_court/green20.jpg',
      'pdl_court/green21.jpg',
      'pdl_court/green22.jpg',
      'pdl_court/green23.jpg',
      'pdl_court/green24.jpg',
      'pdl_court/green25.jpg',
      'pdl_court/blue1.webp',
      'pdl_court/blue2.webp',
      'pdl_court/blue3.jpeg',
      'pdl_court/blue3.webp',
      'pdl_court/blue4.webp',
      'pdl_court/blue5.webp',
      'pdl_court/blue6.webp',
      'pdl_court/blue7.webp',
      'pdl_court/blue8.jpeg',
      'pdl_court/people1.webp',
      'pdl_court/people2.webp'
    ];

    const BALL_TEXTURE_URL = 'pdl_court/pngtree-yellow-tennis-ball-bright-sports-equipment-outdoor-gear-isolated-on-a-png-image_12860496.png';

    // ---------- Сцена ----------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 500);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ---------- Свет ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.4));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(3, 6, 3);
    scene.add(dir);

    // ---------- 360° ФОН (переключение между панорамами) ----------
    const skyGeo = new THREE.SphereGeometry(150, 60, 40);
    const skyMat = new THREE.MeshBasicMaterial({
      side: THREE.BackSide,
      color: 0xffffff
    });
    const skySphere = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skySphere);

    // второй слой для кроссфейда
    const skyMat2 = new THREE.MeshBasicMaterial({
      side: THREE.BackSide,
      transparent: true,
      opacity: 0,
      color: 0xffffff
    });
    const skySphere2 = new THREE.Mesh(skyGeo, skyMat2);
    skySphere2.visible = false;
    scene.add(skySphere2);

    const texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin('anonymous');

    // Заранее грузим все текстуры
    const textures = [];
    let loadedCount = 0;
    backgrounds.forEach((url) => {
      texLoader.load(url, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        textures.push(tex);
        loadedCount++;
      }, undefined, () => { /* игнорируем ошибки */ });
    });

    // Первая текстура — из CSS-фона по умолчанию, если есть
    // (по желанию можно сразу загрузить 'pdl_court/638486607b8cde34560210a7_private-res-padel-3.jpg')
    texLoader.load('pdl_court/638486607b8cde34560210a7_private-res-padel-3.jpg', (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      skyMat.map = tex;
      skyMat.needsUpdate = true;
    });

    let bgIndex = 0;
    let showingBg1 = true;
    function switchBackground() {
      if (textures.length === 0) return;
      bgIndex = (bgIndex + 1) % textures.length;
      const nextTex = textures[bgIndex];

      if (showingBg1) {
        skyMat2.map = nextTex;
        skyMat2.needsUpdate = true;
        skySphere2.visible = true;
        // плавный кроссфейд через opacity
        fadeOpacity(skyMat2, 0, 1, 1500, () => {
          skyMat.map = nextTex;
          skyMat.needsUpdate = true;
          skyMat2.opacity = 0;
          skySphere2.visible = false;
        });
      } else {
        skyMat.map = nextTex;
        skyMat.needsUpdate = true;
      }
      showingBg1 = !showingBg1;
    }

    // помощник плавного изменения прозрачности
    function fadeOpacity(mat, from, to, duration, onDone) {
      const start = performance.now();
      mat.opacity = from;
      (function tick() {
        const t = Math.min((performance.now() - start) / duration, 1);
        mat.opacity = from + (to - from) * t;
        if (t < 1) requestAnimationFrame(tick);
        else if (onDone) onDone();
      })();
    }

    setInterval(switchBackground, 4500);

    // ---------- Пол-корт под ногами ----------
    const floorGeo = new THREE.PlaneGeometry(20, 14);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x2b6b57, roughness: 0.9, metalness: 0.05,
      transparent: true, opacity: 0.9
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.001;
    scene.add(floor);

    const grid = new THREE.GridHelper(20, 20, 0xffffff, 0x88aa88);
    grid.position.y = 0.005;
    grid.material.opacity = 0.35;
    grid.material.transparent = true;
    scene.add(grid);

    // ---------- VRButton ----------
    document.body.appendChild(VRButton.createButton(renderer));

    // ---------- Контроллеры ----------
    const controllerModelFactory = new XRControllerModelFactory();
    function buildController(index) {
      const controller = renderer.xr.getController(index);
      controller.addEventListener('selectstart', onSelectStart);
      scene.add(controller);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -1)
      ]);
      const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffff88 }));
      line.scale.z = 30;
      controller.add(line);

      const grip = renderer.xr.getControllerGrip(index);
      grip.add(controllerModelFactory.createControllerModel(grip));
      scene.add(grip);

      return controller;
    }
    buildController(0);
    buildController(1);

    // ---------- Raycaster ----------
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();
    let activeBalls = [];

    // ---------- Текстура мяча (PNG + число сверху) ----------
    // Кэшируем: одна текстура на каждое число 1..9, чтобы не пересоздавать
    const ballTextures = {};

    function makeBallTexture(number) {
      if (ballTextures[number]) return ballTextures[number];

      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 1) Рисуем PNG-мяч на canvas (загрузим один раз)
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = BALL_TEXTURE_URL;

      // Пока изображение не готово — используем временный жёлтый круг
      ctx.fillStyle = '#dffb4e';
      ctx.beginPath();
      ctx.arc(size/2, size/2, size*0.48, 0, Math.PI*2);
      ctx.fill();

      img.onload = () => {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);

        // 2) Накладываем число поверх
        ctx.fillStyle = '#111';
        ctx.font = 'bold 260px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(number), size/2, size/2 + 20);

        const tex = ballTextures[number];
        if (tex) tex.needsUpdate = true;
      };

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      ballTextures[number] = texture;
      return texture;
    }

    // ---------- Спавн мяча ----------
    function spawnBall() {
      const number = Math.floor(Math.random() * 9) + 1;

      const mat = new THREE.SpriteMaterial({
        map: makeBallTexture(number),
        transparent: true,
        depthWrite: false,
        depthTest: true
      });

      const ball = new THREE.Sprite(mat);
      ball.scale.set(0.35, 0.35, 0.35);

      // случайная позиция в сфере вокруг игрока
      const radius = 3 + Math.random() * 3;      // 3–6 м
      const theta = Math.random() * Math.PI * 2; // азимут
      const y = 1.0 + Math.random() * 1.6;       // 1.0–2.6 м по высоте

      ball.position.set(
        radius * Math.cos(theta),
        y,
        radius * Math.sin(theta)
      );

      ball.userData.number = number;
      ball.userData.spawnTime = performance.now();

      scene.add(ball);
      activeBalls.push(ball);

      // авто-исчезновение через 2 секунды
      setTimeout(() => {
        if (ball.parent) {
          scene.remove(ball);
          ball.material.dispose();
          activeBalls = activeBalls.filter(b => b !== ball);
        }
      }, 2000);
    }

    // ---------- Логика сессии ----------
    let sessionActive = false;
    let sessionEndTime = 0;
    let spawnInterval = null;
    let score = 0, hits = 0, misses = 0;
    const hud = document.getElementById('hud');

    function startSession() {
      document.getElementById('startButton').style.display = 'none';
      sessionActive = true;
      score = 0; hits = 0; misses = 0;

      const durationSec = Math.random() * (320 - 10) + 10;
      sessionEndTime = performance.now() + durationSec * 1000;

      const spawnDelay = 700; // интервал появления
      spawnBall();

      spawnInterval = setInterval(() => {
        if (!sessionActive) return;
        if (performance.now() >= sessionEndTime) { endSession(); return; }
        spawnBall();
      }, spawnDelay);
    }

    function endSession() {
      sessionActive = false;
      clearInterval(spawnInterval);
      activeBalls.forEach(b => { scene.remove(b); b.material.dispose(); });
      activeBalls = [];

      hud.innerHTML = `🏁 Конец!<br>Очки: ${score} | Попаданий: ${hits} | Промахов: ${misses}`;
      const btn = document.getElementById('startButton');
      btn.textContent = 'Играть снова';
      btn.style.display = 'block';
    }

    // ---------- Обработка нажатия триггера ----------
    function onSelectStart(event) {
      if (!sessionActive) return;

      const controller = event.target;
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const intersections = raycaster.intersectObjects(activeBalls, false);
      if (intersections.length > 0) {
        const ball = intersections[0].object;
        const age = performance.now() - ball.userData.spawnTime;
        const bonus = Math.max(0, Math.floor((2000 - age) / 100));
        score += 10 + bonus;
        hits++;
        hud.textContent = `Очки: ${score} | Попаданий: ${hits} | Промахов: ${misses}`;

        scene.remove(ball);
        ball.material.dispose();
        activeBalls = activeBalls.filter(b => b !== ball);
      } else {
        misses++;
        hud.textContent = `Очки: ${score} | Попаданий: ${hits} | Промахов: ${misses}`;
      }
    }

    document.getElementById('startButton').addEventListener('click', startSession);

    // ---------- Рендер-цикл ----------
    renderer.setAnimationLoop(() => {
      // лёгкая левитация и покачивание мячей
      activeBalls.forEach(b => {
        b.position.y += Math.sin(performance.now() * 0.004 + b.userData.spawnTime) * 0.0008;
      });
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
